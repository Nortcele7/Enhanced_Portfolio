<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Certifications</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #C0C0C0;
      --primary-light: #E8E8E8;
      --primary-dark: #A0A0A0;
      --secondary: #B8B8B8;
      --accent: #D3D3D3;
      --success: #87CEEB;
      --success-dark: #70A9CC;
      --warning: #DDA0DD;
      --background: #000000;
      --surface: #111111;
      --card: rgba(40, 40, 40, 0.4);
      --card-hover: rgba(50, 50, 50, 0.5);
      --text-primary: #FFFFFF;
      --text-secondary: #C0C0C0;
      --text-muted: #808080;
      --border: rgba(192, 192, 192, 0.2);
      --border-hover: rgba(192, 192, 192, 0.4);
      --shadow: rgba(0, 0, 0, 0.8);
      --gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      --success-gradient: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%);
      --warning-gradient: linear-gradient(135deg, var(--warning) 0%, #E6E6FA 100%);
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --silver-glow: rgba(192, 192, 192, 0.3);
      --silver-glow-strong: rgba(192, 192, 192, 0.6);
      --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --hover-shadow: 0 16px 64px rgba(0, 0, 0, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: var(--background);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(192, 192, 192, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(192, 192, 192, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: -2;
      pointer-events: none;
    }

    /* Subtle Animated Background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(192, 192, 192, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(184, 184, 184, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(211, 211, 211, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 60% 70%, rgba(135, 206, 235, 0.04) 0%, transparent 50%);
      z-index: -1;
      animation: backgroundShift 35s ease-in-out infinite alternate;
    }

    @keyframes backgroundShift {
      0% { transform: translateX(0) translateY(0) rotate(0deg); }
      100% { transform: translateX(-20px) translateY(-10px) rotate(1deg); }
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 4rem;
      position: relative;
    }

    .header h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 700;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.02em;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.5rem;
      animation: fadeInUp 0.8s ease-out;
    }

    .header p {
      font-size: 1.2rem;
      font-weight: 400;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;  
      color: var(--text-secondary);
      max-width: 700px;
      margin: 0 auto 2.5rem;
      animation: fadeInUp 0.8s ease-out 0.2s both;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 3rem;
      margin-bottom: 2.5rem;
      animation: fadeInUp 0.8s ease-out 0.4s both;
    }

    .stat-item {
      text-align: center;
      padding: 1.2rem 1.5rem;
      border-radius: 20px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      min-width: 140px;
      box-shadow: var(--card-shadow);
      transition: all 0.4s ease;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }

    .stat-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
      pointer-events: none;
    }

    .stat-item:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: var(--hover-shadow);
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--primary);
    }

    .stat-number {
      font-size: 2.2rem;
      font-weight: 700;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--primary);
      display: block;
    }

    .stat-label {
      font-size: 1rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .filter-tabs {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }

    .filter-tab {
      padding: 0.8rem 1.8rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.4s ease;
      font-weight: 500;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      position: relative;
      overflow: hidden;
    }

    .filter-tab::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .filter-tab:hover:not(.active)::before {
      left: 100%;
    }

    .filter-tab.active {
      background: var(--gradient);
      color: white;
      border-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px var(--silver-glow);
    }

    .filter-tab:hover:not(.active) {
      background: rgba(255, 255, 255, 0.2);
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-2px);
    }

    .certifications-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .cert-card {
      background: var(--card);
      border-radius: 24px;
      padding: 2rem;
      border: 1px solid var(--border);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      animation: fadeInUp 0.6s ease-out;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .cert-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .cert-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient);
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .cert-card.verified::before {
      background: var(--success-gradient);
    }

    .cert-card.in-progress::before {
      background: var(--warning-gradient);
    }

    .cert-card:hover::before {
      transform: scaleX(1);
    }

    .cert-card:hover::after {
      opacity: 1;
    }

    .cert-card:hover {
      transform: translateY(-12px) scale(1.02);
      box-shadow: var(--hover-shadow);
      border-color: var(--border-hover);
      background: var(--card-hover);
    }

    .cert-header {
      display: flex;
      align-items: flex-start;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .cert-logo {
      width: 70px;
      height: 70px;
      background: var(--glass-bg);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: var(--primary);
      flex-shrink: 0;
      transition: all 0.4s ease;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 20px var(--silver-glow);
      position: relative;
      overflow: hidden;
    }

    .cert-logo::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: var(--gradient);
      border-radius: 22px;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .cert-card:hover .cert-logo {
      background: var(--gradient);
      color: white;
      transform: rotate(10deg) scale(1.1);
      box-shadow: 0 12px 30px var(--silver-glow-strong);
    }

    .cert-card:hover .cert-logo::before {
      opacity: 1;
    }

    .cert-info {
      flex: 1;
    }

    .cert-title {
      font-size: 1.4rem;
      font-weight: 600;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }

    .cert-issuer {
      font-size: 1rem;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .cert-date {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', 'SF Mono', Monaco, 'Cascadia Code', monospace;
    }

    .cert-status {
      position: absolute;
      top: 1rem;
      right: 1rem;
      padding: 0.4rem 1rem;
      border-radius: 25px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid transparent;
    }

    .cert-status.verified {
      background: rgba(255, 215, 0, 0.2);
      color: #FFD700;
      border-color: rgba(255, 215, 0, 0.4);
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
    }

    .cert-status.in-progress {
      background: rgba(221, 160, 221, 0.2);
      color: var(--warning);
      border-color: rgba(221, 160, 221, 0.4);
      box-shadow: 0 4px 15px rgba(221, 160, 221, 0.3);
    }

    .cert-description {
      color: var(--text-secondary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .cert-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .skill-tag {
      background: rgba(192, 192, 192, 0.15);
      color: var(--primary);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      font-family: 'JetBrains Mono', 'SF Mono', Monaco, monospace;
      border: 1px solid rgba(192, 192, 192, 0.3);
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .skill-tag::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.4s ease;
    }

    .cert-card:hover .skill-tag::before {
      left: 100%;
    }

    .skill-tag:hover {
      background: rgba(192, 192, 192, 0.25);
      transform: translateY(-3px);
      box-shadow: 0 4px 15px var(--silver-glow);
    }

    .cert-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .cert-btn {
      padding: 0.8rem 1.6rem;
      border: none;
      border-radius: 15px;
      font-weight: 500;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.4s ease;
      cursor: pointer;
      font-size: 0.85rem;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
      border: 1px solid transparent;
    }

    .cert-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.3s ease;
    }

    .cert-btn:hover::before {
      left: 100%;
    }

    .cert-btn.primary {
      background: var(--gradient);
      color: white;
      box-shadow: 0 8px 20px var(--silver-glow);
    }

    .cert-btn.primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px var(--silver-glow-strong);
    }

    .cert-btn.secondary {
      background: var(--glass-bg);
      color: var(--text-primary);
      border: 1px solid var(--glass-border);
    }

    .cert-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px var(--silver-glow);
    }

    .hidden {
      display: none;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .cert-card.verified .cert-logo {
      animation: pulse 3s ease-in-out infinite;
    }

    .header h1 {
      animation: fadeInUp 0.8s ease-out, float 6s ease-in-out infinite 2s;
    }

    /* Add subtle sparkle effects */
    .header::before {
      content: '✦';
      position: absolute;
      top: -15px;
      left: 15%;
      color: var(--primary);
      font-size: 1.5rem;
      animation: pulse 2s ease-in-out infinite;
    }

    .header::after {
      content: '✧';
      position: absolute;
      top: 60px;
      right: 20%;
      color: var(--accent);
      font-size: 1.2rem;
      animation: pulse 2s ease-in-out infinite 0.5s;
    }

    /* Certificate Modal Styles */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal.active {
      opacity: 1;
    }

    .certificate-modal-content {
      background: var(--card);
      border-radius: 24px;
      padding: 2rem;
      max-width: 90vw;
      max-height: 90vh;
      width: 900px;
      position: relative;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      box-shadow: var(--hover-shadow);
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: var(--text-primary);
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(90deg);
    }

    .certificate-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .certificate-header h3 {
      font-size: 1.8rem;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .certificate-header p {
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

    .certificate-display {
      margin-bottom: 2rem;
      text-align: center;
    }

    .certificate-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    @media (max-width: 768px) {
      .container {
        padding: 1.5rem;
      }

      .certifications-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .cert-card {
        padding: 1.75rem;
      }

      .stats-bar {
        gap: 1rem;
        flex-wrap: wrap;
      }

      .stat-item {
        min-width: calc(50% - 1rem);
        padding: 1rem;
      }

      .filter-tabs {
        gap: 0.5rem;
        justify-content: flex-start;
      }

      .filter-tab {
        padding: 0.6rem 1.2rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>Professional Certifications</h1>
      <p>A comprehensive collection of my professional achievements and continuous learning journey in technology and development</p>
      
      <div class="stats-bar">
        <div class="stat-item">
          <span class="stat-number" id="verifiedCerts">7</span>
          <span class="stat-label">Verified Certifications</span>
        </div>
      </div>
    </div>

    <div class="filter-tabs">
      <div class="filter-tab active" data-filter="all">All Certifications</div>
      <div class="filter-tab" data-filter="programming">Programming</div>
      <div class="filter-tab" data-filter="ml">Machine Learning</div>
      <div class="filter-tab" data-filter="data">Data Science</div>
      <div class="filter-tab" data-filter="development">Development</div>
      <div class="filter-tab" data-filter="design">Design</div>
    </div>

    <div class="certifications-grid" id="certificationsGrid">
      <!-- Certifications will be dynamically loaded here -->
    </div>
  </div>

  <!-- Certificate Viewer Modal -->
  <div class="modal" id="certificateModal" style="display: none;">
    <div class="modal-content certificate-modal-content">
      <button class="modal-close" onclick="closeCertificateModal()">&times;</button>
      <div class="certificate-viewer">
        <div class="certificate-header">
          <h3 id="modalCertTitle"></h3>
          <p id="modalCertIssuer"></p>
        </div>
        <div class="certificate-display">
          <iframe id="certificateFrame" src="" width="100%" height="600px" style="border: none; border-radius: 12px;"></iframe>
          <img id="certificateImage" src="" alt="Certificate" style="display: none; width: 100%; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3);">
        </div>
        <div class="certificate-actions">
          <a id="downloadCertificate" href="" download class="cert-btn primary">
            <i class="fas fa-download"></i> Download Certificate
          </a>
          <button class="cert-btn secondary" onclick="closeCertificateModal()">
            <i class="fas fa-times"></i> Close
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const certifications = [
      {
        id: 'python-basic-hackerrank',
        title: 'Introduction to Basic Python',
        issuer: 'HackerRank',
        date: 'October 2024',
        status: 'verified',
        category: 'programming',
        logo: 'fab fa-python',
        description: 'Validates expertise in Python programming fundamentals including data types, control structures, functions, and problem-solving techniques.',
        skills: ['Python', 'Problem Solving', 'Data Structures', 'Algorithms'],
        credentialId: 'PYTHON-BASIC-2024',
        certificateImage: 'certificates/python_basic certificate.pdf',
        certificatePdf: 'certificates/python_basic certificate.pdf',
        verifyUrl: 'certificates/python_basic certificate.pdf',
        learnMoreUrl: 'https://www.hackerrank.com/skills-verification/python_basic'
      },
      {
        id: 'java-scaler',
        title: 'Java: Mastering the Fundamentals',
        issuer: 'Scaler',
        date: 'June 2025',
        status: 'verified',
        category: 'programming',
        logo: 'fab fa-java',
        description: 'Comprehensive Java programming course covering object-oriented programming, data structures, algorithms, and advanced Java concepts.',
        skills: ['Java', 'OOP', 'Data Structures', 'Algorithms', 'Autoboxing', 'Unboxing'],
        credentialId: 'SCALER-JAVA-2025',
        certificateImage: 'certificates/Java Certificate.png',
        certificatePdf: 'certificates/Java Certificate.png',
        verifyUrl: 'certificates/Java Certificate.png',
        learnMoreUrl: 'https://www.scaler.com/topics/java/'
      },
      {
        id: 'javascript-basic-hackerrank',
        title: 'Introduction to JavaScript',
        issuer: 'HackerRank',
        date: 'October 2024',
        status: 'verified',
        category: 'development',
        logo: 'fab fa-js-square',
        description: 'Fundamental JavaScript concepts including ES6 features, DOM manipulation, asynchronous programming, and modern JavaScript development practices.',
        skills: ['JavaScript', 'ES6', 'DOM', 'Async Programming', 'Problem Solving'],

    function renderCertifications(certs = certifications) {
      const grid = document.getElementById('certificationsGrid');
      grid.innerHTML = certs.map(cert => `
        <div class="cert-card ${cert.status}" data-category="${cert.category}">
          <div class="cert-status ${cert.status}">
            ${cert.status === 'verified' ? '<i class="fas fa-check-circle"></i> Verified' : '<i class="fas fa-clock"></i> In Progress'}
          </div>
          <div class="cert-header">
            <div class="cert-logo">
              <i class="${cert.logo}"></i>
            </div>
            <div class="cert-info">
              <h3 class="cert-title">${cert.title}</h3>
              ${cert.issuer ? `<div class="cert-issuer">${cert.issuer}</div>` : ''}
              <div class="cert-date">${cert.date}</div>
            </div>
          </div>
          <div class="cert-description">${cert.description}</div>
          <div class="cert-skills">
            ${cert.skills.map(skill => `<span class="skill-tag">${skill}</span>`).join('')}
          </div>
          <div class="cert-actions">
            ${cert.certificateImage || cert.certificatePdf ? `<button onclick="viewCertificate('${cert.id}')" class="cert-btn primary">
              <i class="fas fa-certificate"></i> View Certificate
            </button>` : ''}
            ${cert.verifyUrl && !cert.certificateImage ? `<a href="${cert.verifyUrl}" target="_blank" class="cert-btn primary">
              <i class="fas fa-certificate"></i> Verify Certificate
            </a>` : ''}
            <a href="${cert.learnMoreUrl}" target="_blank" class="cert-btn secondary">
              <i class="fas fa-external-link-alt"></i> Learn More
            </a>
          </div>
        </div>
      `).join('');
    }

    function updateStats() {
      const verified = certifications.filter(cert => cert.status === 'verified').length;
      document.getElementById('verifiedCerts').textContent = verified;
    }

    function setupFilters() {
      const tabs = document.querySelectorAll('.filter-tab');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          // Remove active class from all tabs
          tabs.forEach(t => t.classList.remove('active'));
          // Add active class to clicked tab
          tab.classList.add('active');
          
          const filter = tab.dataset.filter;
          const filteredCerts = filter === 'all' 
            ? certifications 
            : certifications.filter(cert => cert.category === filter);
          
          renderCertifications(filteredCerts);
        });
      });
    }

    function viewCertificate(certId) {
      const cert = certifications.find(c => c.id === certId);
      if (!cert) return;

      const modal = document.getElementById('certificateModal');
      const title = document.getElementById('modalCertTitle');
      const issuer = document.getElementById('modalCertIssuer');
      const frame = document.getElementById('certificateFrame');
      const image = document.getElementById('certificateImage');
      const downloadLink = document.getElementById('downloadCertificate');

      title.textContent = cert.title;
      issuer.textContent = cert.issuer;
      downloadLink.href = cert.certificatePdf || cert.certificateImage;
      downloadLink.download = `${cert.title.replace(/\s+/g, '_')}_Certificate`;

      // Determine if it's a PDF or image
      const filePath = cert.certificateImage || cert.certificatePdf;
      const isPdf = filePath.toLowerCase().includes('.pdf');

      if (isPdf) {
        frame.src = filePath;
        frame.style.display = 'block';
        image.style.display = 'none';
      } else {
        image.src = filePath;
        image.style.display = 'block';
        frame.style.display = 'none';
      }

      modal.style.display = 'flex';
      setTimeout(() => modal.classList.add('active'), 10);
      document.body.style.overflow = 'hidden';
    }

    function closeCertificateModal() {
      const modal = document.getElementById('certificateModal');
      modal.classList.remove('active');
      setTimeout(() => {
        modal.style.display = 'none';
        document.body.style.overflow = 'auto';
      }, 300);
    }

    // Close modal on backdrop click
    document.getElementById('certificateModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeCertificateModal();
      }
    });

    // Close modal on Escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeCertificateModal();
      }
    });

    // Initialize
    renderCertifications();
    updateStats();
    setupFilters();

    // Add stagger animation to cards
    document.addEventListener('DOMContentLoaded', function() {
      const cards = document.querySelectorAll('.cert-card');
      cards.forEach((card, index) => {
        card.style.animationDelay = `${index * 0.1}s`;
      });
    });
  </script>
